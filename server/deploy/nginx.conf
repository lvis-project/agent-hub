events {}
http {
  include /etc/nginx/mime.types;
  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The web client keeps an API token in sessionStorage. Keep the static
    # surface same-origin only and prevent framing or content-type sniffing.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; connect-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;

    # Forward /api/* to the Node.js backend container.
    location /api/ {
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      # The sole public TLS edge overwrites these headers before traffic reaches
      # this loopback-only Compose port. Preserve that normalized single client
      # address; never append an untrusted forwarding chain here.
      # The API trusts only this Compose network's CIDR.
      proxy_set_header X-Real-IP $http_x_real_ip;
      proxy_set_header X-Forwarded-For $http_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 300s;
      client_max_body_size 60m;
    }

    # SPA: try real file first, fall back to index.html so client-side
    # routes (react-router) survive a full page refresh.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
