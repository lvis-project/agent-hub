# Include this location in the TLS-enabled virtual host that is the only public
# listener. The Agent Hub Compose web port remains loopback-only at 127.0.0.1:8082.
# If a CDN is in front, first configure nginx realip directives for only that
# CDN's published CIDRs; then $remote_addr below is the normalized client IP.
location / {
  proxy_pass http://127.0.0.1:8082;
  proxy_http_version 1.1;
  # This snippet belongs only in a TLS virtual host, so static responses also
  # advertise the HTTPS-only transport policy at the public edge.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  proxy_set_header Host $host;
  # Overwrite, never append, any client-supplied forwarding headers.
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
}
