# Include this complete server block from nginx's http context only when a
# cloudflared connector on the same host serves a publicly HTTPS hostname.
# Configure the Tunnel origin as http://127.0.0.1:18082, not localhost.
# Cloudflare terminates the public TLS connection. This listener is explicitly
# loopback-only, so no untrusted network peer can supply CF-Connecting-IP.
#
# Do not use this fragment for a container bridge or another proxy network. In
# those deployments, trust only the verified immediate gateway address instead
# of a broad subnet before applying the overwrite-only header contract below.
# A loopback TCP listener authenticates the host boundary, not a particular
# process. Restrict host-local access and do not use this template on a shared
# or multi-tenant host where another process could reach the listener.
server {
  listen 127.0.0.1:18082;
  server_name _;

  set_real_ip_from 127.0.0.1;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive off;

  location / {
    proxy_pass http://127.0.0.1:8082;
    proxy_http_version 1.1;
    # The public edge is HTTPS even though cloudflared reaches this loopback
    # origin over HTTP, so static responses advertise HTTPS-only transport.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    proxy_set_header Host $host;
    # $remote_addr is normalized from the trusted connector above. Overwrite,
    # never append, every client-supplied forwarding header.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header CF-Connecting-IP "";
  }
}
